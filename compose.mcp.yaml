services:
  mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    container_name: ${FINANCE_MCP_CONTAINER:-family-finance-mcp}
    restart: unless-stopped
    environment:
      FINANCE_DB_HOST: db
      FINANCE_DB_PORT: "5432"
      FINANCE_DB_NAME: ${POSTGRES_DB:-family_finance}
      FINANCE_MCP_DB_USER: ${FINANCE_MCP_DB_USER:?FINANCE_MCP_DB_USER must be set}
      FINANCE_MCP_DB_PASSWORD: ${FINANCE_MCP_DB_PASSWORD:?FINANCE_MCP_DB_PASSWORD must be set}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_ALLOWED_HOSTS: family-finance-mcp:8000,mcp:8000,127.0.0.1:8000,localhost:8000
      MCP_MAX_ROWS: "100"
      MCP_LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - finance_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
