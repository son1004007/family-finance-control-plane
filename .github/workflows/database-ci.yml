name: Database CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_DB: family_finance
      POSTGRES_ADMIN_USER: finance_admin
      POSTGRES_ADMIN_PASSWORD: ci-only-not-a-secret
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          sh -n scripts/migrate_compose.sh
          sh -n scripts/backup_postgres_compose.sh
          sh -n scripts/capture_household_baseline.sh
          if grep -Eq '(^|[[:space:]])eval([[:space:]]|$)' scripts/capture_household_baseline.sh; then
            echo '::error::interactive baseline capture must not eval user input'
            exit 1
          fi

      - name: Start PostgreSQL 16
        run: |
          set -euo pipefail
          docker compose up -d db
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U "$POSTGRES_ADMIN_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs db
          exit 1

      - name: Apply migrations
        run: sh scripts/migrate_compose.sh

      - name: Re-run migrations to prove idempotent runner
        run: |
          set -euo pipefail
          output="$(sh scripts/migrate_compose.sh)"
          printf '%s\n' "$output"
          expected="$(find db/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          actual="$(printf '%s\n' "$output" | grep -c '^SKIP ')"
          test "$actual" -eq "$expected"

      - name: Load synthetic fixture
        run: |
          docker compose exec -T db psql -v ON_ERROR_STOP=1 \
            -U "$POSTGRES_ADMIN_USER" -d "$POSTGRES_DB" \
            < db/fixtures/synthetic_household.sql

      - name: Verify deterministic analytics
        run: |
          docker compose exec -T db psql -v ON_ERROR_STOP=1 \
            -U "$POSTGRES_ADMIN_USER" -d "$POSTGRES_DB" \
            < db/tests/assert_synthetic.sql

      - name: Verify NAS-local baseline capture is idempotent
        shell: bash
        run: |
          set -euo pipefail
          run_capture() {
            LIQUID_CASH="$1" \
            BASELINE_NONINTERACTIVE=1 \
            BASELINE_AS_OF_DATE=2026-02-01 \
            BASELINE_TIMEZONE_OFFSET=+09:00 \
            ADULT1_STATUS=employed \
            ADULT1_ANNUAL_GROSS=55000000 \
            ADULT1_MONTHLY_NET=4000000 \
            ADULT2_STATUS=career_break \
            HOUSING_ASSET=200000000 \
            INVESTMENT_ASSETS=20000000 \
            OTHER_ASSETS=5000000 \
            TOTAL_DEBT=30000000 \
            MONTHLY_RECURRING_SPEND=3000000 \
            sh scripts/capture_household_baseline.sh
          }

          run_capture 10000000
          run_capture 11000000

          docker compose exec -T db psql -v ON_ERROR_STOP=1 \
            -U "$POSTGRES_ADMIN_USER" -d "$POSTGRES_DB" <<'SQL'
          DO $$
          DECLARE
            income NUMERIC;
            monthly_net NUMERIC;
            net_worth NUMERIC;
            recurring NUMERIC;
            active_baseline_rows INTEGER;
          BEGIN
            SELECT i.annual_gross_income, i.monthly_net_income
              INTO income, monthly_net
            FROM analytics.v_current_household_income_by_currency i
            JOIN finance.households h USING (household_id)
            WHERE h.label = 'primary_household' AND i.currency = 'KRW';

            IF income IS DISTINCT FROM 55000000::numeric OR monthly_net IS DISTINCT FROM 4000000::numeric THEN
              RAISE EXCEPTION 'unexpected captured income: annual %, monthly %', income, monthly_net;
            END IF;

            SELECT n.net_worth INTO net_worth
            FROM analytics.v_net_worth_by_currency n
            JOIN finance.households h USING (household_id)
            WHERE h.label = 'primary_household' AND n.currency = 'KRW';

            IF net_worth IS DISTINCT FROM 206000000::numeric THEN
              RAISE EXCEPTION 'unexpected captured net worth: %', net_worth;
            END IF;

            SELECT r.monthly_fixed_obligations INTO recurring
            FROM analytics.v_active_recurring_obligations r
            JOIN finance.households h USING (household_id)
            WHERE h.label = 'primary_household' AND r.currency = 'KRW';

            IF recurring IS DISTINCT FROM 3000000::numeric THEN
              RAISE EXCEPTION 'unexpected captured recurring spend: %', recurring;
            END IF;

            SELECT COUNT(*) INTO active_baseline_rows
            FROM finance.recurring_obligations r
            JOIN finance.households h USING (household_id)
            WHERE h.label = 'primary_household'
              AND r.label = 'baseline_total_monthly_spend'
              AND r.active;

            IF active_baseline_rows <> 1 THEN
              RAISE EXCEPTION 'expected one active baseline recurring row, got %', active_baseline_rows;
            END IF;
          END
          $$;
          SQL
          echo 'BASELINE_CAPTURE_IDEMPOTENCY=PASS'

      - name: Verify AI reader can query
        run: |
          docker compose exec -T db psql -v ON_ERROR_STOP=1 \
            -U "$POSTGRES_ADMIN_USER" -d "$POSTGRES_DB" \
            -c "SET ROLE finance_ai_reader; SELECT COUNT(*) FROM analytics.v_monthly_cash_flow; SELECT COUNT(*) FROM analytics.v_current_employment; SELECT COUNT(*) FROM analytics.v_current_household_income_by_currency;"

      - name: Verify AI reader cannot mutate
        shell: bash
        run: |
          set -euo pipefail
          if docker compose exec -T db psql -v ON_ERROR_STOP=1 \
              -U "$POSTGRES_ADMIN_USER" -d "$POSTGRES_DB" \
              -c "SET ROLE finance_ai_reader; INSERT INTO planning.goals(household_id, goal_type, label) SELECT household_id, 'forbidden', 'must_not_insert' FROM finance.households LIMIT 1;"; then
            echo '::error::finance_ai_reader unexpectedly mutated data'
            exit 1
          fi
          echo 'AI_READER_MUTATION_DENIED=PASS'

      - name: Verify controlled writer is planning-only
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T db psql -v ON_ERROR_STOP=1 \
            -U "$POSTGRES_ADMIN_USER" -d "$POSTGRES_DB" \
            -c "SET ROLE finance_ai_writer; INSERT INTO planning.goals(household_id, goal_type, label) SELECT household_id, 'test', 'writer_allowed_planning' FROM finance.households LIMIT 1;"

          if docker compose exec -T db psql -v ON_ERROR_STOP=1 \
              -U "$POSTGRES_ADMIN_USER" -d "$POSTGRES_DB" \
              -c "SET ROLE finance_ai_writer; INSERT INTO finance.accounts(household_id, account_type, account_label) SELECT household_id, 'test', 'writer_must_not_touch_ledger' FROM finance.households LIMIT 1;"; then
            echo '::error::finance_ai_writer unexpectedly mutated finance ledger'
            exit 1
          fi

          if docker compose exec -T db psql -v ON_ERROR_STOP=1 \
              -U "$POSTGRES_ADMIN_USER" -d "$POSTGRES_DB" \
              -c "SET ROLE finance_ai_writer; INSERT INTO finance.employment_snapshots(household_id, person_id, employment_status, as_of_date) SELECT h.household_id, p.person_id, 'employed', CURRENT_DATE FROM finance.households h JOIN finance.persons p USING (household_id) LIMIT 1;"; then
            echo '::error::finance_ai_writer unexpectedly mutated employment facts'
            exit 1
          fi
          echo 'AI_WRITER_PLANNING_BOUNDARY=PASS'

      - name: Verify logical backup and isolated restore
        run: |
          set -euo pipefail
          output="$(BACKUP_DIR="$RUNNER_TEMP/family-finance-backups" sh scripts/backup_postgres_compose.sh)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '^POSTGRES_BACKUP_RESTORE=PASS$'

      - name: Show database version
        run: |
          docker compose exec -T db psql -At \
            -U "$POSTGRES_ADMIN_USER" -d "$POSTGRES_DB" \
            -c "SELECT version();"

      - name: Cleanup
        if: always()
        run: docker compose down -v
