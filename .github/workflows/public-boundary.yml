name: Public boundary

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run boundary scanner tests
        run: python3 -m unittest discover -s tests -p 'test_public_boundary.py' -v

      - name: Scan public repository boundary
        env:
          # Optional repository secret. One exact private term per line.
          # The scanner logs only a SHA-256 fingerprint, never the term itself.
          PUBLIC_BOUNDARY_DENYLIST: ${{ secrets.PUBLIC_BOUNDARY_DENYLIST }}
        run: python3 scripts/check_public_boundary.py

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
