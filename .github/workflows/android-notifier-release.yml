name: Android Notifier Signed Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Android signing secret is missing: $name"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-notifier-release.jks"
          chmod 600 "$RUNNER_TEMP/android-notifier-release.jks"
          test -s "$RUNNER_TEMP/android-notifier-release.jks"
          echo 'ANDROID_SIGNING_SECRET_SET=PASS'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Download verified Gradle
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          curl -fsSLo gradle.zip.sha256 https://services.gradle.org/distributions/gradle-8.10.2-bin.zip.sha256
          printf '%s  %s\n' "$(cat gradle.zip.sha256)" gradle.zip | sha256sum -c -
          unzip -q gradle.zip
          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Set monotonic sideload version
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build and verify signed release APK
        shell: bash
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/android-notifier-release.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          java -version
          gradle -p android-notifier --no-daemon :app:assembleRelease
          apk='android-notifier/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apksigner.txt"
          sha256sum "$apk" | tee android-notifier/app/build/outputs/apk/release/app-release.apk.sha256
          grep -q '^Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/apksigner.txt"
          echo 'ANDROID_SIGNED_RELEASE=PASS'

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: family-finance-notifier-signed-${{ github.run_number }}
          path: |
            android-notifier/app/build/outputs/apk/release/app-release.apk
            android-notifier/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
